apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: {{ include "mechanic.fullname" . }}-openai-responses-api
spec:
  distribution:
    # Verified against the OGXServer CRD on an OpenShift AI 3.5 cluster:
    # "rh-dev" is accepted but the admission webhook warns it's deprecated -
    # "rh" is the current name and resolves to the same image.
    name: 'rh'
  # Verified live 2026-10-21: the "rh" distribution's env-var-driven config
  # generator doesn't support an inline embedding provider (see the comment
  # in ogx-config.yaml for the full story and a link to the upstream repo
  # confirming it). This replaces that generator entirely with a hand-
  # written config.yaml that adds the missing provider - see ogx-config.yaml.
  overrideConfig:
    name: {{ include "mechanic.fullname" . }}-ogx-config
    key: config.yaml
  workload:
    replicas: 1
    # Diagnosed live 2026-10-21 against the crashing pod in the mechanic
    # namespace: this used to be a hand-rolled PVC mounted via
    # workload.overrides.volumes/volumeMounts at /opt/app-root/src/.ogx. Two
    # problems with that: (1) that PVC had stale root:root 755+sticky
    # directories under distributions/ left over from before this migration
    # (likely from a prior root-run pod under this project's anyuid SCC),
    # which a non-root OGX pod can't write into ("PermissionError: [Errno 13]
    # Permission denied"); (2) moving the hand-rolled mount to /.ogx (the
    # CRD's own default) to work around that collided with a volume the
    # operator ALWAYS creates itself at that exact path - an emptyDir named
    # "ogx-storage" - causing "duplicate entries for key [mountPath=\"/.ogx\"]".
    # The actual fix is this structured field: it tells the operator to swap
    # its own default emptyDir for a real, operator-managed PVC at the same
    # path, instead of fighting it with a second, hand-rolled volume. No PVC
    # template needed in this chart any more - the operator creates and owns
    # its own (named "<OGXServer-name>-pvc").
    storage:
      mountPath: /.ogx
      size: 20Gi
    overrides:
      # serviceAccountName lives directly under workload.overrides, not a
      # separate "podOverrides" key - verified live: a "podOverrides" key is
      # silently pruned by the CRD (no error, the field just never reaches
      # the pod), which would have quietly broken the custom service account.
      serviceAccountName: "{{ .Release.Name }}-mechanic-sa"
      env:
        - name: VLLM_URL
          value: 'https://gemma-4-kserve-workload-svc.sandbox.svc.cluster.local:8000/v1'
        - name: VLLM_TLS_VERIFY
          value: 'false'
        - name: VLLM_API_TOKEN
          value: 'fake'
        - name: INFERENCE_MODEL
          value: gemma-4
        # ENABLE_SENTENCE_TRANSFORMERS, EMBEDDING_PROVIDER, EMBEDDING_MODEL,
        # EMBEDDING_PROVIDER_MODEL_ID, and ENABLE_INLINE_MILVUS used to live
        # here but do nothing now that spec.overrideConfig (above) replaces
        # the env-var-driven config generator entirely - see ogx-config.yaml,
        # which hardcodes the embedding/vector_io provider config directly.
        # First switched from remote::milvus (db.home.glroland.com:19530) to
        # inline::milvus (embedded Milvus Lite) after the remote server's
        # downtime took out an AutoRAG run - then switched again, to
        # inline::chroma, after discovering live that inline::milvus breaks
        # search on every OGX pod restart (confirmed in
        # ogx.providers.remote.vector_io.milvus.milvus.MilvusIndex
        # .initialize(): it skips load_collection() whenever the collection
        # already exists, leaving a persisted collection "released" and
        # every search failing until the vector store is deleted and
        # re-ingested). See ogx-config.yaml for the full story. CHROMADB_PATH
        # below is what ogx-config.yaml's vector_io provider reads via
        # ${env.VAR}; it must point under workload.storage.mountPath (/.ogx)
        # so the db survives pod restarts instead of living on the
        # container's ephemeral filesystem.
        - name: CHROMADB_PATH
          value: '/.ogx/chroma'
        # Verified live: the "rh" distribution's StackConfig requires a
        # Postgres-backed KV + SQL state store at startup regardless of which
        # vector_io backend (Milvus here) is used - omitting these crashes the
        # pod at boot with a pydantic validation error on
        # storage.backends.kv_default.kv_postgres/sql_postgres. Keeping the
        # pre-existing "lls-postgresql" Service/Secret name below since it's
        # an external dependency not managed by this chart - rename it to
        # ogx-postgresql too if you're doing a full rebrand of that resource.
        - name: POSTGRES_HOST
          value: lls-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: database-name
              name: lls-postgresql
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: database-user
              name: lls-postgresql
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: lls-postgresql
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ .Release.Name }}-openai-responses-api
spec:
  to:
    # Verified live: the OGX Operator names the generated Service
    # "<OGXServer-name>-service" (status.serviceURL confirmed this on a
    # running OGXServer), same convention as the old LlamaStackDistribution
    # operator.
    name: {{ include "mechanic.fullname" . }}-openai-responses-api-service
    weight: 100
    kind: Service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
