              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'requests'  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def import_test_pdfs(
                    base_url: str,
                    pdf_filenames: str,
                    output_path: dsl.OutputPath("input-pdfs"),
                ):
                    import os
                    import requests
                    import shutil

                    os.makedirs(output_path, exist_ok=True)
                    filenames = [f.strip() for f in pdf_filenames.split(",") if f.strip()]

                    for filename in filenames:
                        url = f"{base_url.rstrip('/')}/{filename}"
                        file_path = os.path.join(output_path, filename)

                        try:
                            with requests.get(url, stream=True, timeout=10) as response:
                                response.raise_for_status()
                                with open(file_path, "wb") as f:
                                    shutil.copyfileobj(response.raw, f)
                            print(f"Downloaded {filename}")
                        except requests.exceptions.RequestException as e:
                            print(f"Failed to download {filename}: {e}, skipping.")

            image: 'registry.redhat.io/ubi9/python-312:9.6'
        exec-register-vector-db:
          container:
            args:
              - '--executor_input'
              - '{{$}}'
              - '--function_to_execute'
              - register_vector_db
            command:
              - sh
              - '-c'
              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'llama-stack-client==0.2.10' 'fire' 'requests'  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def register_vector_db(
                    service_url: str,
                    vector_db_id: str,
                    embed_model_id: str,
                ):
                    from llama_stack_client import LlamaStackClient

                    client = LlamaStackClient(base_url=service_url)

                    models = client.models.list()
                    matching_model = next(
                        (m for m in models if m.provider_resource_id == embed_model_id), None
                    )

                    if not matching_model:
                        raise ValueError(
                            f"Model with ID '{embed_model_id}' not found on LlamaStack server."
                        )

                    if matching_model.model_type != "embedding":
                        raise ValueError(f"Model '{embed_model_id}' is not an embedding model")

                    embedding_dimension = matching_model.metadata["embedding_dimension"]

                    # Register the vector DB
                    _ = client.vector_dbs.register(
                        vector_db_id=vector_db_id,
                        embedding_model=matching_model.identifier,
                        embedding_dimension=embedding_dimension,
                        provider_id="milvus",
                    )
                    print(
                        f"Registered vector DB '{vector_db_id}' with embedding model '{embed_model_id}'."
                    )

            image: 'registry.redhat.io/ubi9/python-312:9.6'
    pipelineInfo:
      description: Converts PDF documents in a git repository to Markdown using Docling and generates embeddings
      name: docling-convert-pipeline
    root:
      dag:
        tasks:
          create-pdf-splits:
            cachingOptions:
              enableCache: true
            componentRef:
              name: comp-create-pdf-splits
            dependentTasks:
              - import-test-pdfs
            inputs:
              artifacts:
                input_path:
                  taskOutputArtifact:
                    outputArtifactKey: output_path
                    producerTask: import-test-pdfs
              parameters:
                num_splits:
                  componentInputParameter: num_workers
            taskInfo:
              name: create-pdf-splits
          for-loop-1:
            componentRef:
              name: comp-for-loop-1
            dependentTasks:
              - create-pdf-splits
              - import-test-pdfs
            inputs:
              artifacts:
                pipelinechannel--import-test-pdfs-output_path:
                  taskOutputArtifact:
                    outputArtifactKey: output_path
                    producerTask: import-test-pdfs
              parameters:
                pipelinechannel--create-pdf-splits-Output:
                  taskOutputParameter:
                    outputParameterKey: Output
                    producerTask: create-pdf-splits
                pipelinechannel--embed_model_id:
                  componentInputParameter: embed_model_id
                pipelinechannel--max_tokens:
                  componentInputParameter: max_tokens
                pipelinechannel--service_url:
                  componentInputParameter: service_url
                pipelinechannel--use_gpu:
                  componentInputParameter: use_gpu
                pipelinechannel--vector_db_id:
                  componentInputParameter: vector_db_id
            parameterIterator:
              itemInput: pipelinechannel--create-pdf-splits-Output-loop-item
              items:
                inputParameter: pipelinechannel--create-pdf-splits-Output
            taskInfo:
              name: for-loop-1
          import-test-pdfs:
            cachingOptions:
              enableCache: true
            componentRef:
              name: comp-import-test-pdfs
            inputs:
              parameters:
                base_url:
                  componentInputParameter: base_url
                pdf_filenames:
                  componentInputParameter: pdf_filenames
            taskInfo:
              name: import-test-pdfs
          register-vector-db:
            cachingOptions: {}
            componentRef:
              name: comp-register-vector-db
            inputs:
              parameters:
                embed_model_id:
                  componentInputParameter: embed_model_id
                service_url:
                  componentInputParameter: service_url
                vector_db_id:
                  componentInputParameter: vector_db_id
            taskInfo:
              name: register-vector-db
      inputDefinitions:
        parameters:
          base_url:
            defaultValue: 'https://raw.githubusercontent.com/glroland/mechanic/refs/heads/main/chatbot/src/assets'
            description: Base URL to fetch PDF files from
            isOptional: true
            parameterType: STRING
          embed_model_id:
            defaultValue: ibm-granite/granite-embedding-125m-english
            description: Model ID for embedding generation
            isOptional: true
            parameterType: STRING
          max_tokens:
            defaultValue: 2500
            description: Maximum number of tokens per chunk
            isOptional: true
            parameterType: NUMBER_INTEGER
          num_workers:
            defaultValue: 1
            description: Number of docling worker pods to use
            isOptional: true
            parameterType: NUMBER_INTEGER
          pdf_filenames:
            defaultValue: c3_repair.pdf
            description: Comma-separated list of PDF filenames to download and convert
            isOptional: true
            parameterType: STRING
          service_url:
            defaultValue: 'https://my-llama-stack-my-llama-stack.apps.ocp.home.glroland.com'
            description: URL of the Milvus service
            isOptional: true
            parameterType: STRING
          use_gpu:
            defaultValue: false
            description: Enable GPU in the docling workers
            isOptional: true
            parameterType: BOOLEAN
          vector_db_id:
            defaultValue: mechanic_vector_db
            description: ID of the vector database to store embeddings
            isOptional: true
            parameterType: STRING
    schemaVersion: 2.1.0
    sdkVersion: kfp-2.14.6
  platformSpec:
    platforms:
      kubernetes:
        deploymentSpec:
          executors:
            exec-docling-convert:
              nodeSelector:
                nodeSelectorJson:
                  runtimeValue:
                    constant: {}
              tolerations:
                - effect: NoSchedule
                  key: nvidia.com/gpu
                  operator: Exists
