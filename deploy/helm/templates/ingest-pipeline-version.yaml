                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'docling>=2.43.0' 'transformers' 'sentence-transformers' 'llama-stack==0.2.10' 'llama-stack-client==0.2.10' 'pymilvus' 'fire' 'rapidocr-onnxruntime' 'rapidocr' 'onnxruntime'  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def docling_convert(
                    input_path: dsl.InputPath("input-pdfs"),
                    pdf_split: List[str],
                    output_path: dsl.OutputPath("output-md"),
                    embed_model_id: str,
                    max_tokens: int,
                    service_url: str,
                    vector_db_id: str,
                ):
                    import pathlib

                    from docling.datamodel.base_models import InputFormat, ConversionStatus
                    from docling.datamodel.pipeline_options import PdfPipelineOptions, RapidOcrOptions
                    from docling.document_converter import DocumentConverter, PdfFormatOption
