              - |

                if ! [ -x "$(command -v pip)" ]; then
                    python3 -m ensurepip || python3 -m ensurepip --user || apt-get install python3-pip
                fi

                PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<"3.9"' && "$0" "$@"
              - sh
              - '-ec'
              - |
                program_path=$(mktemp -d)

                printf "%s" "$0" > "$program_path/ephemeral_component.py"
                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"
              - |+

                import kfp
                from kfp import dsl
                from kfp.dsl import *
                from typing import *

                def create_pdf_splits(
                    input_path: dsl.InputPath("input-pdfs"),
                    num_splits: int,
                ) -> List[List[str]]:
                    import pathlib

                    # Split our entire directory of pdfs into n batches, where n == num_splits
                    all_pdfs = [path.name for path in pathlib.Path(input_path).glob("*.pdf")]
                    splits = [
                        batch for batch in (all_pdfs[i::num_splits] for i in range(num_splits)) if batch
                    ]
                    return splits or [[]]

            image: 'registry.redhat.io/ubi9/python-312:9.6'
        exec-docling-convert:
          container:
            args:
