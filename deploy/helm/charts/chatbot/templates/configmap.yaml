apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mechanic.fullname" . }}
  labels:
    {{- include "mechanic.labels" . | nindent 4 }}
immutable: false
data:
  OPENAI_BASE_URL: "https://{{ include "mechanic.fullname" . }}-openai-responses-api-mechanic.apps.ocp.home.glroland.com/v1"
  OPENAI_API_KEY: "nokeyneeded"
  MODEL: "vllm-inference/gemma-4"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://eclipse.home.glroland.com:4317"
  MLFLOW_TRACKING_URI: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443"
  MLFLOW_TRACKING_TOKEN: ""
  SET_TOKEN_FROM_FILE: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  MLFLOW_TRACKING_HEADERS: '{"x-mlflow-workspace": "mechanic"}'
