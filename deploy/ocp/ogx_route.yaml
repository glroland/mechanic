kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: ogx
spec:
  path: /
  to:
    kind: Service
    # Verified live: the OGX Operator names the generated Service
    # "<OGXServer-name>-service", same as the old operator convention.
    name: ogx-server-service
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
