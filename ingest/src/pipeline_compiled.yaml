  comp-condition-2:
    dag:
      tasks:
        register-vector-store-and-files:
          cachingOptions: {}
          componentRef:
            name: comp-register-vector-store-and-files
          inputs:
            parameters:
              base_url:
                componentInputParameter: pipelinechannel--base_url
