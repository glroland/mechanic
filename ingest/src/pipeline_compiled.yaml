deploymentSpec:
  executors:
    exec-register-vector-store-and-files:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_vector_store_and_files
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'ogx-client==1.5.0'\
          \ 'fire' 'requests'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_vector_store_and_files(\n    service_url: str,\n   \
          \ vector_store_name: str,\n    embedding_model_id: str,\n    max_tokens:\
          \ int,\n    chunk_overlap_tokens: int,\n    base_url: str,\n    source_filenames:\
          \ str,\n    timeout: float,\n):\n    import requests\n    from ogx_client\
          \ import OgxClient\n\n    client = OgxClient(base_url=service_url)\n\n \
          \   def _parse_response(response):\n        \"\"\"Read an ogx_client *_without_preload_content()\
          \ response and return\n        its parsed JSON. Confirmed live 2026-10-21:\
          \ a naive\n        response.json()[\"id\"] on a non-2xx response raises\
          \ a misleading\n        KeyError (e.g. 'id') with the real server-side error\
          \ message\n        discarded - this surfaces that message instead.\n   \
          \     \"\"\"\n        response.read()\n        if not response.is_success:\n\
          \            raise RuntimeError(\n                f\"OGX request failed:\
          \ {response.status_code} \"\n                f\"{response.reason_phrase}\
          \ - {response.text}\"\n            )\n        return response.json()\n\n\
          \    # Every call below uses the \"_without_preload_content\" variant and\
          \ reads\n    # .json() directly, instead of the typed create()/list()/retrieve()\n\
          \    # methods. Confirmed live 2026-10-21: ogx-client==1.5.0's bundled\n\
          \    # response models are stricter than what this OGX server (1.2.4+rhaiv.0)\n\
          \    # actually returns - e.g. OpenAIFileObject requires a \"status\" field\
          \ the\n    # server's /v1/files response doesn't include, so client.files.create()\n\
          \    # raised a pydantic ValidationError even though the upload itself\n\
          \    # succeeded (HTTP 200). The \"_without_preload_content\" variants return\n\
          \    # the raw httpx.Response and skip that validation entirely.\n    #\n\
          \    # ogx_client always sends requests with stream=True (confirmed in\n\
          \    # ogx_client.rest.RESTClientObject.request), so every response here\
          \ is\n    # unread until .read() is called explicitly - the typed create()\
          \ methods\n    # do this internally before deserializing (hence \"RESTResponse.read()\n\
          \    # must be called before passing it to response_deserialize()\" in\n\
          \    # ApiClient.response_deserialize's own assert message), but the\n \
          \   # \"_without_preload_content\" variants skip that step entirely. Calling\n\
          \    # .json()/.content on an unread httpx.Response raises\n    # httpx.ResponseNotRead\
          \ - confirmed live 2026-10-21. Call .read() first.\n\n    # Upload all files\
          \ first and collect file_ids\n    #\n    # Source files are the already-converted\
          \ markdown (chatbot/src/assets/*.md),\n    # not the raw PDF. Confirmed\
          \ live 2026-10-21 (MLflow trace\n    # tr-e88efb22a600a006273afff02d0aa8e1,\
          \ mlflow.traceInputs): uploading the raw\n    # PDF here routes it through\
          \ OGX's inline::auto file_processors provider,\n    # which does its own\
          \ server-side pypdf text extraction. For this particular\n    # PDF (an\
          \ old Word doc run through \"Acrobat PDFWriter 4.05\", per its own\n   \
          \ # embedded metadata), several tables use a font whose glyph encoding is\n\
          \    # corrupted in the source file itself - confirmed by rendering those\
          \ pages\n    # to an image (not just reading the text layer) and seeing\
          \ the same garbage\n    # glyphs, so no extraction method can recover them.\
          \ pypdf hits this on every\n    # affected page; docling (used to produce\
          \ the .md file, see `make\n    # ingest-data`) was run once, by hand, with\
          \ its failures manually cleaned up\n    # in the committed .md (see git\
          \ history for chatbot/src/assets/c3_repair.md).\n    # Uploading that already-clean\
          \ markdown instead avoids re-running (and\n    # re-breaking on) server-side\
          \ PDF extraction altogether - confirmed live by\n    # uploading a .md file\
          \ through this same endpoint and observing clean\n    # search results for\
          \ a query that previously returned glyph noise from the\n    # PDF-sourced\
          \ vector store.\n    file_ids = []\n    for filename in source_filenames.split(\"\
          ,\"):\n        source = f\"{base_url}/{filename.strip()}\"\n        print(\"\
          Downloading and uploading document:\", source)\n\n        try:\n       \
          \     # Download the docs from URL\n            response = requests.get(source)\n\
          \            response.raise_for_status()  # Raise an exception for bad status\
          \ codes\n\n            file_basename = source.split(\"/\")[-1]\n\n     \
          \       # ogx_client.ApiClient.files_parameters() only accepts a\n     \
          \       # (filename, filedata) 2-tuple of raw bytes - no content-type as\n\
          \            # a 3rd element (unlike llama_stack_client/the OpenAI SDK\n\
          \            # convention) and it does `filename, filedata = v` directly\
          \ with\n            # no .read(), so a BytesIO wrapper isn't safe either.\n\
          \            # Content-type gets auto-guessed from the filename extension\
          \ via\n            # mimetypes.guess_type() - resolves to \"text/markdown\"\
          \ for the\n            # .md sources used here (confirmed: mimetypes already\
          \ registers\n            # that extension, no explicit override needed).\n\
          \            upload_response = client.files.create_without_preload_content(\n\
          \                file=(file_basename, response.content),\n             \
          \   purpose=\"assistants\",\n            )\n            file_id = _parse_response(upload_response)[\"\
          id\"]\n            file_ids.append(file_id)\n            print(f\"Successfully\
          \ uploaded {file_basename} (file_id: {file_id})\")\n\n        except Exception\
          \ as e:\n            print(f\"ERROR: Failed to upload {filename.strip()}:\
          \ {str(e)}\")\n            raise\n\n    print(f\"Successfully uploaded {len(file_ids)}\
          \ files: {file_ids}\")\n\n    # client.models.list() just proxies to client.openai.list();\
          \ calling the\n    # latter's raw variant directly to skip its oneOf-wrapper\
          \ deserialization.\n    models = _parse_response(client.openai.list_without_preload_content())[\"\
          data\"]\n    matching_model = next((m for m in models if m[\"id\"] == embedding_model_id),\
          \ None)\n\n    if not matching_model:\n        available = [m[\"id\"] for\
          \ m in models]\n        raise ValueError(\n            f\"Model '{embedding_model_id}'\
          \ not found. Available: {available}\"\n        )\n\n    custom_metadata\
          \ = matching_model.get(\"custom_metadata\") or {}\n    model_type = custom_metadata.get(\"\
          model_type\")\n    if model_type != \"embedding\":\n        raise ValueError(\n\
          \            f\"Model '{embedding_model_id}' is not an embedding model (type={model_type})\"\
          \n        )\n\n    embedding_dimension = int(float(custom_metadata.get(\"\
          embedding_dimension\")))\n\n    # Warm up the embedding model. Response\
          \ is discarded, but still parsed\n    # (rather than left unread) so a failure\
          \ here raises a clear error\n    # instead of leaving the httpx streaming\
          \ response open.\n    _parse_response(\n        client.embeddings.create_without_preload_content(\n\
          \            model=embedding_model_id,\n            input=\"warmup\",\n\
          \            _request_timeout=timeout,\n        )\n    )\n\n    # Create\
          \ empty vector store first, before inserting files.\n    # Purpose: Depending\
          \ on the size and number of files, attempting to create the vector store\n\
          \    # and add files in a single step may lead to timeouts.\n    try:\n\
          \        create_response = client.vector_stores.create_without_preload_content(\n\
          \            name=vector_store_name,\n            file_ids=[],\n       \
          \     chunking_strategy={\n                \"type\": \"static\",\n     \
          \           \"static\": {\n                    \"max_chunk_size_tokens\"\
          : max_tokens,\n                    \"chunk_overlap_tokens\": chunk_overlap_tokens,\n\
          \                },\n            },\n            extra_body={\n        \
          \        \"embedding_model\": embedding_model_id,\n                \"embedding_dimension\"\
          : embedding_dimension,\n                # Must match the vector_io provider_id\
          \ actually registered\n                # on the server (deploy/helm/templates/ogx-config.yaml),\n\
          \                # not just the provider_type - confirmed live 2026-10-21:\n\
          \                # \"milvus\" (stale, pre-OGX-migration value) failed with\n\
          \                # \"Provider `milvus` not found\"; the registered provider_id\n\
          \                # is \"milvus-remote\".\n                \"provider_id\"\
          : \"milvus-remote\",\n            },\n            _request_timeout=timeout,\n\
          \        )\n        vector_store_id = _parse_response(create_response)[\"\
          id\"]\n        print(\n            f\"Successfully created vector store\
          \ '{vector_store_name}' with ID: {vector_store_id}\"\n        )\n    except\
          \ Exception as e:\n        print(f\"ERROR: Failed to create vector store\
          \ '{vector_store_name}': {str(e)}\")\n        raise\n\n    # Add files to\
          \ vector store\n    try:\n        for file_id in file_ids:\n           \
          \ print(f\"Adding file_id '{file_id}' to vector store '{vector_store_name}'\"\
          )\n            # Note: this is client.vector_stores_files, not client.vector_stores.files\
          \ -\n            # ogx-client puts it at the top level, unlike llama_stack_client.\n\
          \            _parse_response(\n                client.vector_stores_files.create_without_preload_content(\n\
          \                    vector_store_id=vector_store_id,\n                \
          \    file_id=file_id,\n                    _request_timeout=timeout,\n \
          \               )\n            )\n        vector_store_details = _parse_response(\n\
          \            client.vector_stores.retrieve_without_preload_content(vector_store_id)\n\
          \        )\n        print(f\"Vector store details: {vector_store_details}\"\
          )\n    except Exception as e:\n        print(f\"WARNING: Some files failed\
          \ to be added to vector store: {str(e)}\")\n\n"
        image: quay.io/modh/odh-pipeline-runtime-pytorch-cuda-py312-ubi9@sha256:72ff2381e5cb24d6f549534cb74309ed30e92c1ca80214669adb78ad30c5ae12
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          cpuLimit: 4.0
          cpuRequest: 0.5
          memoryLimit: 6.442450944
          memoryRequest: 2.147483648
          resourceCpuLimit: '4'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 6Gi
          resourceMemoryRequest: 2Gi
