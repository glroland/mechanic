    executorLabel: exec-register-vector-store-and-files-2
    inputDefinitions:
      parameters:
        base_url:
          parameterType: STRING
        chunk_overlap_tokens:
          parameterType: NUMBER_INTEGER
        embedding_model_id:
          parameterType: STRING
        max_tokens:
          parameterType: NUMBER_INTEGER
