# PIPELINE DEFINITION
# Name: vector-store-files-pipeline
# Description: Creates a vector store with embeddings from pre-converted markdown files
#              from a GitHub source.
# Inputs:
#    base_url: str [Default: 'https://raw.githubusercontent.com/glroland/mechanic/refs/heads/main/chatbot/src/assets']
#    chunk_overlap_tokens: int [Default: 64.0]
#    embedding_model_id: str [Default: 'sentence-transformers/granite-embedding-125m-english']
#    max_tokens: int [Default: 2500.0]
#    service_url: str [Default: 'http://mechanic-openai-responses-api-service:8321']
#    source_filenames: str [Default: 'c3_repair.md']
#    timeout: float [Default: 300.0]
#    use_gpu: bool [Default: False]
#    vector_store_name: str [Default: 'mechanic_vector_db']
