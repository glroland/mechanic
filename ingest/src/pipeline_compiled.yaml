pipelineInfo:
  description: 'Creates a vector store with embeddings from pre-converted markdown
    files

    from a GitHub source.'
  name: vector-store-files-pipeline
root:
  dag:
    tasks:
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        inputs:
          parameters:
            pipelinechannel--base_url:
              componentInputParameter: base_url
            pipelinechannel--chunk_overlap_tokens:
              componentInputParameter: chunk_overlap_tokens
            pipelinechannel--embedding_model_id:
              componentInputParameter: embedding_model_id
            pipelinechannel--max_tokens:
              componentInputParameter: max_tokens
            pipelinechannel--service_url:
              componentInputParameter: service_url
            pipelinechannel--source_filenames:
              componentInputParameter: source_filenames
            pipelinechannel--timeout:
              componentInputParameter: timeout
            pipelinechannel--use_gpu:
              componentInputParameter: use_gpu
            pipelinechannel--vector_store_name:
              componentInputParameter: vector_store_name
        taskInfo:
          name: condition-branches-1
  inputDefinitions:
    parameters:
      base_url:
        defaultValue: https://raw.githubusercontent.com/glroland/mechanic/refs/heads/main/chatbot/src/assets
        description: Base URL to fetch source files from
        isOptional: true
        parameterType: STRING
      chunk_overlap_tokens:
        defaultValue: 64.0
        description: Number of overlapping tokens between chunks
        isOptional: true
        parameterType: NUMBER_INTEGER
      embedding_model_id:
        defaultValue: sentence-transformers/granite-embedding-125m-english
        description: Model ID for embedding generation
        isOptional: true
        parameterType: STRING
      max_tokens:
        defaultValue: 2500.0
        description: Maximum number of tokens per chunk
        isOptional: true
        parameterType: NUMBER_INTEGER
      service_url:
        defaultValue: http://mechanic-openai-responses-api-service:8321
        description: URL of the Milvus service
        isOptional: true
        parameterType: STRING
      source_filenames:
        defaultValue: c3_repair.md
        description: 'Comma-separated list of filenames to download and upload.

          Must be pre-extracted text (markdown/.md), not raw PDFs - see the comment

          in register_vector_store_and_files() for why.'
        isOptional: true
        parameterType: STRING
      timeout:
        defaultValue: 300.0
        description: Timeout to use for each OGX (formerly Llama Stack) API call
        isOptional: true
        parameterType: NUMBER_DOUBLE
      use_gpu:
        defaultValue: false
        description: Enable GPU usage for embedding generation
        isOptional: true
        parameterType: BOOLEAN
      vector_store_name:
        defaultValue: mechanic_vector_db
        description: Name of the vector store to store embeddings
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-register-vector-store-and-files:
          nodeSelector:
            nodeSelectorJson:
              runtimeValue:
                constant: {}
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
