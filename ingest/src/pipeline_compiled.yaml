# PIPELINE DEFINITION
# Name: vector-store-files-pipeline
# Description: Creates a vector store with embeddings from pre-converted markdown files
#              from a GitHub source.
# Inputs:
#    base_url: str [Default: 'https://raw.githubusercontent.com/glroland/mechanic/refs/heads/main/chatbot/src/assets']
#    chunk_overlap_tokens: int [Default: 64.0]
#    embedding_model_id: str [Default: 'sentence-transformers/granite-embedding-125m-english']
#    max_tokens: int [Default: 2500.0]
#    service_url: str [Default: 'http://mechanic-openai-responses-api-service:8321']
#    source_filenames: str [Default: 'c3_repair.md']
#    timeout: float [Default: 300.0]
#    use_gpu: bool [Default: False]
#    vector_store_name: str [Default: 'mechanic_vector_db']
components:
  comp-condition-2:
    dag:
      tasks:
        register-vector-store-and-files:
          cachingOptions: {}
          componentRef:
            name: comp-register-vector-store-and-files
          inputs:
            parameters:
              base_url:
                componentInputParameter: pipelinechannel--base_url
              chunk_overlap_tokens:
                componentInputParameter: pipelinechannel--chunk_overlap_tokens
              embedding_model_id:
                componentInputParameter: pipelinechannel--embedding_model_id
              max_tokens:
                componentInputParameter: pipelinechannel--max_tokens
              service_url:
                componentInputParameter: pipelinechannel--service_url
              source_filenames:
                componentInputParameter: pipelinechannel--source_filenames
              timeout:
                componentInputParameter: pipelinechannel--timeout
              vector_store_name:
                componentInputParameter: pipelinechannel--vector_store_name
          taskInfo:
            name: register-vector-store-and-files
    inputDefinitions:
      parameters:
        pipelinechannel--base_url:
          parameterType: STRING
        pipelinechannel--chunk_overlap_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--embedding_model_id:
          parameterType: STRING
        pipelinechannel--max_tokens:
          parameterType: NUMBER_INTEGER
        pipelinechannel--service_url:
          parameterType: STRING
        pipelinechannel--source_filenames:
          parameterType: STRING
        pipelinechannel--timeout:
          parameterType: NUMBER_DOUBLE
